# Serves the built site inside the image (replaces nginx:alpine's default.conf).
#
# The one setting that genuinely matters here is `absolute_redirect off`. The legal
# pages live at /terms/ and /privacy/ as directory indexes, so a request for /terms
# (no trailing slash) makes nginx issue a 301 to add it. By default that Location
# header is absolute and built from what nginx knows about itself — which behind the
# Ayula reverse proxy means `http://<host>:8093/terms/`: wrong scheme, wrong port,
# and it dumps the visitor on the internal address. Relative redirects keep the
# browser's own scheme and host. (The single-page sloth/sleuth siblings never hit
# this, which is why they have no nginx.conf.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ayula intercepts 404s and serves the branded minified.work page, but this
    # keeps the version out of any response reached directly over the LAN.
    server_tokens off;

    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/xml image/svg+xml application/json;

    # HTML stays revalidated so a deploy is visible immediately; the favicons, the
    # OG card, robots, and the sitemap change rarely and can be cached.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.html$      { add_header Cache-Control "no-cache"; }
    location ~* \.(png|svg|ico)$ { expires 7d; add_header Cache-Control "public, max-age=604800"; }
    location ~* \.(xml|txt)$     { expires 1d; add_header Cache-Control "public, max-age=86400"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
